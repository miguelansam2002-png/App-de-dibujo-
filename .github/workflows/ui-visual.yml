name: Trazo Técnico 3D Studio V12 - Prueba visual
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba-interfaz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright-core
      - name: Construir la aplicación
        run: npm run build
      - name: Probar escritorio y tableta
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser-smoke.mjs
      - name: Validar creación B-Rep y exportación STEP
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/cad-browser.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrazoTecnico3D-Studio-V12-Capturas-QA
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14